
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Subway Surfers | TrexGames</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }

    .topbar {
      flex: 0 0 48px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 12px;
      background: #080808;
      border-bottom: 1px solid #242424;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 34px;
      padding: 0 12px;
      border: 1px solid #333;
      border-radius: 8px;
      background: #171717;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .game-title {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
    }

    .game-area {
      flex: 1;
      width: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: #000;
    }

    .game-area iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 0;
      background: #000;
    }

    @media (orientation: landscape) {
      .topbar {
        flex-basis: 40px;
        padding: 4px 10px;
      }

      .back-button {
        height: 30px;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <a class="back-button" href="index.html">
      ← Back
    </a>

    <h1 class="game-title">Subway Surfers</h1>
  </header>

  <main class="game-area">
    <iframe
      src="https://nite.games/embed/subway-surfers"
      title="Subway Surfers"
      allow="fullscreen; autoplay; gamepad; pointer-lock"
      allowfullscreen
      loading="eager"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  </main>

</body>
</html>
